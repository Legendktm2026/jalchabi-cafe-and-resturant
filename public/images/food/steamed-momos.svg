<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#241913"/>
      <stop offset="70%" stop-color="#150f0b"/>
      <stop offset="100%" stop-color="#0d0805"/>
    </radialGradient>
    <!-- Gold Trim Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#f5d77f"/>
      <stop offset="100%" stop-color="#c58b4b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="800" fill="url(#bgGrad)"/>
  
  <!-- Subtle Heritage Border Frame -->
  <rect x="24" y="24" width="752" height="752" rx="28" fill="none" stroke="#c58b4b" stroke-width="2" stroke-opacity="0.35"/>
  <rect x="34" y="34" width="732" height="732" rx="22" fill="none" stroke="#d4af37" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="8,6"/>

  <!-- Top Category & Bengali Badge -->
  <g transform="translate(400, 68)" text-anchor="middle">
    <rect x="-160" y="-22" width="320" height="40" rx="20" fill="#1e140d" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <text x="0" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#e6be8a" letter-spacing="3">INDO-CHINESE • JALCHABI</text>
  </g>

  <!-- Central Culinary Illustration with Drop Shadow -->
  <g filter="url(#shadow)">
    
      <!-- Bamboo Steamer Basket Base -->
      <circle cx="400" cy="400" r="230" fill="#2d1c10" stroke="#c58b4b" stroke-width="8"/>
      <circle cx="400" cy="400" r="205" fill="#3e2717" stroke="#b9770e" stroke-width="4"/>
      <!-- Bamboo Slat Floor -->
      <line x1="230" y1="400" x2="570" y2="400" stroke="#25160c" stroke-width="3"/>
      <line x1="250" y1="340" x2="550" y2="340" stroke="#25160c" stroke-width="3"/>
      <line x1="250" y1="460" x2="550" y2="460" stroke="#25160c" stroke-width="3"/>
      <!-- Momo 1 (Top Left) -->
      <path d="M 310 320 C 300 270, 360 270, 370 320 C 360 340, 310 340, 310 320 Z" fill="#fdfefe" stroke="#d5dbdb" stroke-width="3"/>
      <path d="M 320 290 Q 335 310 350 290" stroke="#bdc3c7" stroke-width="2" fill="none"/>
      <!-- Momo 2 (Top Right) -->
      <path d="M 430 320 C 420 270, 480 270, 490 320 C 480 340, 430 340, 430 320 Z" fill="#fdfefe" stroke="#d5dbdb" stroke-width="3"/>
      <path d="M 440 290 Q 455 310 470 290" stroke="#bdc3c7" stroke-width="2" fill="none"/>
      <!-- Momo 3 (Bottom Left) -->
      <path d="M 290 420 C 280 370, 340 370, 350 420 C 340 440, 290 440, 290 420 Z" fill="#fdfefe" stroke="#d5dbdb" stroke-width="3"/>
      <!-- Momo 4 (Bottom Right) -->
      <path d="M 450 420 C 440 370, 500 370, 510 420 C 500 440, 450 440, 450 420 Z" fill="#fdfefe" stroke="#d5dbdb" stroke-width="3"/>
      <!-- Center Fiery Red Garlic Chili Chutney Bowl -->
      <circle cx="400" cy="400" r="45" fill="#1b120c" stroke="#d4af37" stroke-width="3"/>
      <circle cx="400" cy="400" r="38" fill="#c0392b"/>
      <circle cx="395" cy="395" r="30" fill="#e74c3c" opacity="0.85"/>
      <circle cx="400" cy="400" r="3" fill="#f1c40f"/>
      <circle cx="405" cy="395" r="3" fill="#f1c40f"/>
      <!-- Plentiful Rising Steam -->
      <path d="M 340 220 Q 320 160 350 110" stroke="#f5efe6" stroke-width="4" stroke-linecap="round" opacity="0.45" fill="none"/>
      <path d="M 400 200 Q 420 150 390 100" stroke="#f5efe6" stroke-width="5" stroke-linecap="round" opacity="0.5" fill="none"/>
      <path d="M 460 220 Q 480 160 450 110" stroke="#f5efe6" stroke-width="4" stroke-linecap="round" opacity="0.45" fill="none"/>
    
  </g>

  <!-- Bottom Dish Info Banner -->
  <g transform="translate(400, 680)" text-anchor="middle">
    <!-- Dish Title -->
    <text x="0" y="0" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="600" fill="#f5efe6" letter-spacing="1">
      Darjeeling Steamed Chicken Momos
    </text>
    <!-- Bengali Subtitle -->
    <text x="0" y="32" font-family="'Noto Sans Bengali', system-ui, sans-serif" font-size="20" font-weight="500" fill="#e6be8a">
      দার্জিলিং স্পেশাল স্টিমড মোমো
    </text>
    <!-- Provenance / Description Pills -->
    <text x="0" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#c9bea9" letter-spacing="1">
      Thin-Skin Dumplings • Spicy Red Garlic Dip • Clear Broth
    </text>
  </g>

  <!-- Signature Badge -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="180" height="30" rx="15" fill="#2d1c10" stroke="#d4af37" stroke-width="1" opacity="0.9"/>
    <text x="16" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#f5efe6">✨ Handcrafted Hill Station Special</text>
  </g>

  <!-- Ready for Enhanced Pixabay / WebP Tag -->
  <g transform="translate(560, 80)">
    <rect x="0" y="0" width="160" height="30" rx="15" fill="#1b261e" stroke="#27ae60" stroke-width="1" opacity="0.9"/>
    <text x="14" y="20" font-family="system-ui, monospace" font-size="11" font-weight="600" fill="#2ecc71">● 4K ENHANCED</text>
  </g>
</svg>