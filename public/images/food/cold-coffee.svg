<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#241913"/>
      <stop offset="70%" stop-color="#150f0b"/>
      <stop offset="100%" stop-color="#0d0805"/>
    </radialGradient>
    <!-- Gold Trim Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#f5d77f"/>
      <stop offset="100%" stop-color="#c58b4b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="800" fill="url(#bgGrad)"/>
  
  <!-- Subtle Heritage Border Frame -->
  <rect x="24" y="24" width="752" height="752" rx="28" fill="none" stroke="#c58b4b" stroke-width="2" stroke-opacity="0.35"/>
  <rect x="34" y="34" width="732" height="732" rx="22" fill="none" stroke="#d4af37" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="8,6"/>

  <!-- Top Category & Bengali Badge -->
  <g transform="translate(400, 68)" text-anchor="middle">
    <rect x="-160" y="-22" width="320" height="40" rx="20" fill="#1e140d" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <text x="0" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#e6be8a" letter-spacing="3">BEVERAGES • JALCHABI</text>
  </g>

  <!-- Central Culinary Illustration with Drop Shadow -->
  <g filter="url(#shadow)">
    
      <!-- Mason Jar / Glass Outline -->
      <rect x="310" y="210" width="180" height="260" rx="20" fill="#1b120c" stroke="#f5efe6" stroke-width="4"/>
      <!-- Creamy Frothy Cold Coffee -->
      <rect x="316" y="250" width="168" height="214" rx="14" fill="#87532a"/>
      <!-- Coffee Froth & Milk Marbling -->
      <path d="M 320 270 Q 360 290 400 260 T 480 270" stroke="#d5b08c" stroke-width="10" fill="none"/>
      <!-- Scoop of Rich Vanilla Ice Cream Float -->
      <circle cx="400" cy="220" r="50" fill="#fffdf7" stroke="#f9e79f" stroke-width="3"/>
      <!-- Cocoa Powder Dusting -->
      <circle cx="390" cy="210" r="3" fill="#4a2711"/>
      <circle cx="410" cy="215" r="3" fill="#4a2711"/>
      <circle cx="385" cy="225" r="2.5" fill="#4a2711"/>
      <circle cx="415" cy="230" r="3" fill="#4a2711"/>
      <!-- Chocolate Drizzle -->
      <path d="M 370 220 Q 400 240 430 215" stroke="#3e1f08" stroke-width="4" fill="none"/>
      <!-- Paper Straw -->
      <line x1="450" y1="120" x2="410" y2="430" stroke="#c58b4b" stroke-width="8" stroke-linecap="round"/>
    
  </g>

  <!-- Bottom Dish Info Banner -->
  <g transform="translate(400, 680)" text-anchor="middle">
    <!-- Dish Title -->
    <text x="0" y="0" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="600" fill="#f5efe6" letter-spacing="1">
      Creamy Cold Coffee with Ice Cream Float
    </text>
    <!-- Bengali Subtitle -->
    <text x="0" y="32" font-family="'Noto Sans Bengali', system-ui, sans-serif" font-size="20" font-weight="500" fill="#e6be8a">
      ক্রিমি কোল্ড কফি উইথ ভ্যানিলা আইসক্রিম
    </text>
    <!-- Provenance / Description Pills -->
    <text x="0" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#c9bea9" letter-spacing="1">
      Chilled Espresso • Velvety Full Cream Milk • Vanilla Float
    </text>
  </g>

  <!-- Signature Badge -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="180" height="30" rx="15" fill="#2d1c10" stroke="#d4af37" stroke-width="1" opacity="0.9"/>
    <text x="16" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#f5efe6">✨ Artisanal Cafe Refreshment</text>
  </g>

  <!-- Ready for Enhanced Pixabay / WebP Tag -->
  <g transform="translate(560, 80)">
    <rect x="0" y="0" width="160" height="30" rx="15" fill="#1b261e" stroke="#27ae60" stroke-width="1" opacity="0.9"/>
    <text x="14" y="20" font-family="system-ui, monospace" font-size="11" font-weight="600" fill="#2ecc71">● 4K ENHANCED</text>
  </g>
</svg>