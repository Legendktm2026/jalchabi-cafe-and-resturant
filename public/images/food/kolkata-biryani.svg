<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#241913"/>
      <stop offset="70%" stop-color="#150f0b"/>
      <stop offset="100%" stop-color="#0d0805"/>
    </radialGradient>
    <!-- Gold Trim Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#f5d77f"/>
      <stop offset="100%" stop-color="#c58b4b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="800" fill="url(#bgGrad)"/>
  
  <!-- Subtle Heritage Border Frame -->
  <rect x="24" y="24" width="752" height="752" rx="28" fill="none" stroke="#c58b4b" stroke-width="2" stroke-opacity="0.35"/>
  <rect x="34" y="34" width="732" height="732" rx="22" fill="none" stroke="#d4af37" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="8,6"/>

  <!-- Top Category & Bengali Badge -->
  <g transform="translate(400, 68)" text-anchor="middle">
    <rect x="-160" y="-22" width="320" height="40" rx="20" fill="#1e140d" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <text x="0" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#e6be8a" letter-spacing="3">KOLKATA HERITAGE • JALCHABI</text>
  </g>

  <!-- Central Culinary Illustration with Drop Shadow -->
  <g filter="url(#shadow)">
    
      <!-- Royal Brass Platter -->
      <circle cx="400" cy="400" r="240" fill="#2d1c10" stroke="#d4af37" stroke-width="8"/>
      <circle cx="400" cy="400" r="220" fill="#1f140c" stroke="#c59b27" stroke-width="3" stroke-dasharray="6,4"/>
      <!-- Saffron Rice Base -->
      <ellipse cx="400" cy="410" rx="180" ry="140" fill="#fcf6e8"/>
      <ellipse cx="390" cy="390" rx="160" ry="120" fill="#fbe8a6" opacity="0.9"/>
      <!-- Kolkata Golden Aloo -->
      <ellipse cx="450" cy="380" rx="50" ry="42" fill="#d99b26" stroke="#b37812" stroke-width="3"/>
      <ellipse cx="445" cy="375" rx="35" ry="28" fill="#e8b13d" opacity="0.8"/>
      <!-- Boiled Farm Egg -->
      <ellipse cx="340" cy="430" rx="36" ry="48" fill="#fff9eb" stroke="#eed59b" stroke-width="3" transform="rotate(-20 340 430)"/>
      <circle cx="342" cy="435" r="16" fill="#f5b324" opacity="0.85"/>
      <!-- Tender Chicken Leg / Piece -->
      <path d="M 330 330 C 370 290, 440 310, 430 350 C 420 390, 340 380, 330 330 Z" fill="#8c4314" stroke="#662e08" stroke-width="3"/>
      <!-- Beresta Fried Onions & Saffron Strands -->
      <path d="M 370 360 Q 390 350 410 365" stroke="#4a1c03" stroke-width="4" stroke-linecap="round"/>
      <path d="M 420 420 Q 440 410 460 425" stroke="#4a1c03" stroke-width="4" stroke-linecap="round"/>
      <path d="M 350 400 Q 370 395 385 410" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
      <path d="M 410 340 Q 425 330 435 345" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
      <!-- Aromatic Steam Rising -->
      <path d="M 360 220 Q 350 170 380 130" stroke="#f5efe6" stroke-width="3" stroke-linecap="round" opacity="0.4" fill="none"/>
      <path d="M 400 210 Q 420 160 390 120" stroke="#f5efe6" stroke-width="4" stroke-linecap="round" opacity="0.5" fill="none"/>
      <path d="M 440 225 Q 460 175 430 135" stroke="#f5efe6" stroke-width="3" stroke-linecap="round" opacity="0.4" fill="none"/>
    
  </g>

  <!-- Bottom Dish Info Banner -->
  <g transform="translate(400, 680)" text-anchor="middle">
    <!-- Dish Title -->
    <text x="0" y="0" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="600" fill="#f5efe6" letter-spacing="1">
      Kolkata Royal Chicken Biryani
    </text>
    <!-- Bengali Subtitle -->
    <text x="0" y="32" font-family="'Noto Sans Bengali', system-ui, sans-serif" font-size="20" font-weight="500" fill="#e6be8a">
      কলকাতা শাহি চিকেন বিরিয়ানি
    </text>
    <!-- Provenance / Description Pills -->
    <text x="0" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#c9bea9" letter-spacing="1">
      Long-grain Basmati • Golden Aloo • Meetha Attar • Egg
    </text>
  </g>

  <!-- Signature Badge -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="180" height="30" rx="15" fill="#2d1c10" stroke="#d4af37" stroke-width="1" opacity="0.9"/>
    <text x="16" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#f5efe6">✨ Kolkata Heritage Signature</text>
  </g>

  <!-- Ready for Enhanced Pixabay / WebP Tag -->
  <g transform="translate(560, 80)">
    <rect x="0" y="0" width="160" height="30" rx="15" fill="#1b261e" stroke="#27ae60" stroke-width="1" opacity="0.9"/>
    <text x="14" y="20" font-family="system-ui, monospace" font-size="11" font-weight="600" fill="#2ecc71">● 4K ENHANCED</text>
  </g>
</svg>